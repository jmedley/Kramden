<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kramden Dashboard</title> 
<link rel="stylesheet" href="options.css">
<script src="../scripts/data.js"></script>
</head>
<body>

  <main>
    <section id="section-options" aria-label="Email tracker">
      <div class="section-card">
        <div class="section-header">
          <h2>Options</h2>
        </div>

        <div class="card-content">
          <form id="form-email-tracker" novalidate>
            <div id="div-tracking">
              <div class="option-title">
                <label for="select-followed-emails">Tracked Emails</label>
              </div>
              <div id="div-tracked">  
                <select id="select-followed-emails" name="followed-emails" size="8">
                  <!-- Options will be populated by JavaScript -->
                </select>
                <button class="btn" id="btn-stop-tracking" disabled aria-label="Stop tracking selected email">Stop tracking</button>
              </div>
              <div id="div-add-tracking">
                <div id="div-add-job-site">
                  <label for="input-add-job-site">Job Site</label>
                  <input
                    type="text"
                    id="input-add-job-site"
                    placeholder="Job site name"
                    autocomplete="url"
                    spellcheck="false"
                    aria-label="Job site to track"
                  />
                </div>
                <div id="div-add-email">
                  <label for="input-add-email">Email</label>
                  <input
                    type="email"
                    id="input-add-email"
                    placeholder="name@example.com"
                    autocomplete="email"
                    spellcheck="false"
                    aria-label="Email to track"
                  />
                </div>
                <button type="submit" class="btn" id="btn-add-email">Track</button>
                <span class="error-msg" id="error">Enter a valid email</span>
              </div>
            </div>
          </form>
        </div>
      </div>
    </section>

  </main>
  <script src="options.js"></script>
</body>
</html>
