<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kramden Dashboard</title>
  <link rel="stylesheet" href="options.css">
  <script type="module" src="../scripts/data.js"></script>
  <script type="module" src="../scripts/emailClient.js"></script>
  <script type="module" src="../EmailParsers/index.js"></script>
</head>

<body>
  <main>
    <section id="section-jobs-list" aria-label="section-jobs-list">
      <div class="section-card">
        <div class="section-header">
          <h2><img src="../images/kramden-16.png" alt="Jobs" /> Jobs</h2>
          <!-- START HERE: When count-days changes, show a save button-->
          <span class="count"><span id="count-jobs"></span> roles in emails received in the last <select id="count-days">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8</option>
              <option value="9">9</option>
              <option value="10">10</option>
              <option value="11">11</option>
              <option value="12">12</option>
              <option value="13">13</option>
              <option value="14">14</option>
              <option value="15">15</option>
              <option value="16">16</option>
              <option value="17">17</option>
              <option value="18">18</option>
              <option value="19">19</option>
              <option value="20">20</option>
              <option value="21">21</option>
              <option value="22">22</option>
              <option value="23">23</option>
              <option value="24">24</option>
              <option value="25">25</option>
              <option value="26">26</option>
              <option value="27">27</option>
              <option value="28">28</option>
              <option value="29">29</option>
              <option value="30">30</option>
              <option value="31">31</option>
            </select> days</span>
          <button class="btn" id="btn-refresh-jobs" type="button" aria-label="Refresh jobs list">Refresh</button>
        </div>
        <template id="job-row-template">
          <tr>
            <td><span class="job-title"></span></td>
            <td class="company"></td>
            <td class="location"></td>
            <td class="pay"></td>
            <td class="actions">
              <a class="btn-open" href="#" target="_blank">Open</a>
              <button class="btn-copy" type="button" data-url="">Copy link</button>
            </td>
          </tr>
        </template>
        <table>
          <thead>
            <tr>
              <th>Job Title</th>
              <th>Company</th>
              <th>Location</th>
              <th>Pay</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="body-jobs-list">
            <!-- Job rows will be populated here by JavaScript -->
          </tbody>
        </table>
      </div>

      <section id="section-options" aria-label="Email tracker">
        <div class="section-card">
          <div class="section-header">
            <h2>Options</h2>
          </div>
          <div class="card-content">
            <form id="form-email-tracker" novalidate>
              <div id="div-tracking">
                <div class="option-title">
                  <label for="select-tracked-senders">Tracked Senders</label>
                </div>
                <div id="div-tracked">
                  <select id="select-tracked-senders" name="followed-emails" size="8">
                    <!-- Options will be populated by JavaScript -->
                  </select>
                  <div id="div-tracked-actions">
                    <button class="btn" id="btn-stop-tracking" type="button" disabled
                      aria-label="Stop tracking selected email">Stop
                      tracking</button>
                    <button class="btn" id="btn-refresh-senders" type="button"
                      aria-label="Refresh tracked senders list">Refresh senders</button>
                  </div>
                </div>
                <div id="div-add-tracking">
                  <div id="div-sender">
                    <label for="input-sender">Sender</label>
                    <input type="text" id="input-sender" placeholder="Sender" autocomplete="url" spellcheck="false"
                      aria-label="Sender to track" />
                  </div>
                  <div id="div-sender-email">
                    <label for="input-sender-email">Email</label>
                    <input type="email" id="input-sender-email" placeholder="name@example.com" autocomplete="email"
                      spellcheck="false" aria-label="Email to track" />
                  </div>
                  <button type="button" class="btn" id="btn-track-sender" disabled>Track</button>
                  <span class="error-msg" id="error">Enter a valid email</span>
                </div>
              </div>
            </form>
          </div>
          <div class="card-content">
            <form id="form-job-titles" novalidate>
              <div id="div-job-titles">
                <div class="option-title">
                  <label for="select-job-titles">Job Titles</label>
                </div>
                <div id="div-selected-titles">
                  <select id="select-job-titles" name="job-titles" size="8" aria-label="Job titles to track">
                    <!-- Options will be populated by JavaScript -->
                  </select>
                  <div id="div-job-title-actions">
                    <button class="btn" id="btn-remove-job-title" type="button" disabled
                      aria-label="Remove selected job title">Remove</button>
                    <button class="btn" id="btn-refresh-job-titles" type="button"
                      aria-label="Refresh job titles list">Refresh list</button>
                  </div>
                </div>
              </div>
              <div id="div-add-job-title">
                <div id="div-job-title">
                  <label for="input-job-title">Title</label>
                  <input type="text" id="input-job-title" placeholder="Job title" spellcheck="false"
                    aria-label="Job title to track" />
                </div>
                <button type="button" class="btn" id="btn-add-job-title" disabled>Add</button>
              </div>
            </form>
          </div>
        </div>
      </section>

  </main>

  <script type="module" src="../scripts/jobsView.js"></script>
  <script type="module" src="options.js"></script>
</body>

</html>
