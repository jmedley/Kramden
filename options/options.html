<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Search Report — April 29–30, 2026</title> 
<link rel="stylesheet" href="options.css">
</head>
<body>

  <main>
    <section>
      <h1>📬 Job Search Email Report</h1>
<p class="subtitle">April 29–30, 2026 &nbsp;·&nbsp; Scanned from Gmail "Job Search" label</p>
    </section>

      


    <section class="card" aria-label="Email tracker">
      <div class="list-label">
        <h1>Tracked emails</h1>
        <span class="count" id="count">0 emails</span>
      </div>

      <ul class="list" id="list" role="listbox" aria-label="Tracked emails list" tabindex="0">
        <li class="empty" id="empty">No emails tracked yet.<br />Add one below to get started.</li>
      </ul>

      <button class="btn-secondary" id="stop" disabled aria-label="Stop tracking selected email">Stop tracking</button>

      <label for="my-select">Choose an option:</label>
      <select id="my-select" name="my-select" size="8">
        <option value="1">Option 1</option>
        <option value="2">Option 2</option>
        <option value="3">Option 3</option>
        <option value="4">Option 4</option>
        <option value="5">Option 5</option>
        <option value="6">Option 6</option>
        <option value="7">Option 7</option>
        <option value="8">Option 8</option>
        <option value="9">Option 9</option>
        <option value="10">Option 10</option>
      </select>


      <form class="input-row" id="form" novalidate>
        <div class="input-wrap">
          <input
            type="email"
            id="emailList"
            placeholder="name@example.com"
            autocomplete="email"
            spellcheck="false"
            aria-label="Email to track"
          />
          <span class="error-msg" id="error">Enter a valid email</span>
        </div>
        <button type="submit" class="btn-primary" id="track">Track</button>
      </form>

      <div class="footnote">
        <span>Click a row to select · <kbd>Enter</kbd> to track · <kbd>Del</kbd> to stop</span>
        <span id="status" aria-live="polite"></span>
      </div>
    </section>

  </main>
  <script src="options.js"></script>
</body>
</html>
